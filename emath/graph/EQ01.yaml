# graph/de1.yaml — 「EQ01 常微分方程」章（EQ01.1–EQ01.14）语义边真源。
# schema、方向约定与派生边覆盖规则见 A1.yaml 头部。
#
# 本文件的边来自**数据里的显式声明块**（各单元 statement 的「它依赖什么 / 谁依赖它」）：
# 组内边两侧互认（上游列本单元为下游 + 本单元列上游）；跨章边为单向声明，
# 但措辞清晰无噪声句式（无「对照混入依赖段」「分号第三方陈述」，见 HANDOFF §7.8 的三类噪声）。
# 覆盖后「同组编号序递进」派生边作废 —— 基线把同组所有编号在前的单元都算 prereq
# （如 EQ01.7 的基线是 [EQ01.1..de1.6]），声明收窄为直接依赖，丢掉的边经脚本逐条验证
# 为传递冗余或并行方法误判（EQ01.4 可降阶与 EQ01.5 特征方程是两条独立路径）。
# EQ01.15–EQ01.17（Bessel/Legendre/统一视角）被多个单元声明为下游但**尚未入库**，
# 入库后需回来补 applies。
notebook_commit: 9ca4702

nodes:
  EQ01.1: # 核心思想（两个动作：化为恰当 + 积分）
    # 起点：声明块自述依赖 TL01（求和）、TL06（分部积分），即 TL01.1 / TL06.1。
    prereq: []
      # 「它依赖什么：TL01（求和）、TL06（分部积分）」——积分方程两边要逐项积分。
    tension: []
    dual: []
    applies: [] # 声明的下游（EQ01.2–EQ01.9）已由各单元的 prereq 承载

  EQ01.2: # 积分因子的系统求法
    prereq:
      # 「它依赖什么：EQ01.1 的两个动作」
      - EQ01.1
    tension: []
    dual: []
    applies: []

  EQ01.3: # 一阶线性方程的完整示例
    prereq:
      # 「它依赖什么：EQ01.2 的积分因子（特例 a）」
      - EQ01.2
    tension: []
    dual: []
    applies: []

  EQ01.4: # 可降阶的高阶方程
    prereq:
      # 「它依赖什么：EQ01.1 的「阶数与类型」、EQ01.3 的一阶方程解法（降阶后要解一阶）」
      - EQ01.1
      - EQ01.3
    tension: []
    dual: []
    applies: []

  EQ01.5: # 二阶线性常系数方程
    prereq:
      # 「它依赖什么：EQ01.1 的分类、EQ01.3 的一阶（降阶后用）」。
      # 注：基线里有 EQ01.4→EQ01.5（可降阶），但特征方程法与降阶是**并行路径**，
      # 声明未列（links 编号序噪声），丢。
      - EQ01.1
      - EQ01.3
    tension: []
    dual: []
    applies: []

  EQ01.6: # Euler 方程（等维方程）
    prereq:
      # 「它依赖什么：EQ01.5 的常系数解法（解法二的终点）」；
      # EQ01.4 侧声明「下游：EQ01.6（Euler 方程的「换自变量」）」—— 两侧互认。
      - EQ01.5
      - EQ01.4
    tension: []
    dual: []
    applies: []

  EQ01.7: # 待定系数法（常系数）
    prereq:
      # 「它依赖什么：EQ01.5 的 y_h（共振判定要用特征根）」。
      # 基线的 EQ01.4/EQ01.6 为同组递进噪声（待定系数不依赖它们）。
      - EQ01.5
    tension: []
    dual: []
    applies: []

  EQ01.8: # 常数变易法（通用）
    prereq:
      # 「它依赖什么：EQ01.5/EQ01.6 的齐次解、EQ01.7 的分工（四类用待定系数）」
      - EQ01.5
      - EQ01.6
      - EQ01.7
    tension: []
    dual: []
    applies: []

  EQ01.9: # 存在唯一性定理（Picard）
    prereq:
      # 「它依赖什么：EQ01.1 的方程分类、AN02.1/AN04.1 的压缩映射与不动点」。
      # 本单元的要点正是「从「闭式」转向「定性」」——与 EQ01.2–EQ01.8 的求解方法
      # 是**独立轨道**，基线的 8 条组内递进边全部为噪声，丢。
      # PR05.1→EQ01.9（links 明写）同样不采：随机过程与 Picard 迭代是对照语义，声明未列。
      - EQ01.1
      - AN02.1
      - AN04.1
    tension: []
    dual: []
    applies: []

  EQ01.10: # 线性系统
    prereq:
      # 「它依赖什么：EQ01.5（标量情形）、EQ01.9（唯一性）、NM03.1/NM04.1（矩阵函数计算）」
      - EQ01.5
      - EQ01.9
      - NM03.1
      - NM04.1
    tension: []
    dual: []
    applies: []

  EQ01.11: # 稳定性理论
    prereq:
      # 「它依赖什么：EQ01.5（特征根）、EQ01.10（e^{At} 的长期行为）」。
      # 注：EQ01.11 声明的「下游：AN02.1（Lyapunov）」**不采**——AN02.1 同时是 EQ01.9 的
      # 上游（压缩映射），两个方向并存会造假环，且为单向声明。
      - EQ01.5
      - EQ01.10
    tension: []
    dual: []
    applies: []

  EQ01.12: # Sturm–Liouville 问题
    prereq:
      # 「它依赖什么：EQ01.5（二阶线性方程的框架）、AN02.4（自伴算子与谱定理）」
      - EQ01.5
      - AN02.4
    tension: []
    dual: []
    applies: []

  EQ01.13: # 常点展开
    prereq:
      # 「它依赖什么：EQ01.5 的常系数（本例恰为常系数可用特征方程）、
      #   EQ01.12（S-L 框架）、AN07.1（幂级数与收敛半径）」。
      # 注：基线的 EQ01.9→EQ01.13（links 明写）不采：级数解的收敛性归 AN07.1 管，
      # 存在唯一性不是级数展开的先修，声明未列。
      - EQ01.5
      - EQ01.12
    tension: []
    dual: []
    applies: []

  EQ01.14: # Frobenius 方法（正则奇点）
    prereq:
      # 「它依赖什么：EQ01.13（常点展开，本条的起点）、EQ01.6（重根的 ln）」。
      # EQ01.6 从 EQ01.5→EQ01.6 可达但不在 EQ01.13 的祖先里，须显式写。
      - EQ01.13
      - EQ01.6
    tension: []
    dual: []
    applies:
      # Frobenius 方法的两大应用：Bessel（正则奇点 s=1/2 型）与 Legendre。
      - EQ01.15
      - EQ01.16

  EQ01.15: # Bessel 方程
    prereq:
      # 「它依赖什么：EQ01.12（S-L 框架）、EQ01.13/EQ01.14（Frobenius 展开正是
      # 求解手段；Bessel 方程 x=0 是正则奇点）」。
      # 跨章：TL08.4（Stirling 公式）——J_ν 大宗量渐近的收尾工具，多条声明一致点名。
      # 注：links 里的 EQ02.10（未入库）与 CG05.1（球谐函数是应用而非前修）不采。
      - EQ01.12
      - EQ01.13
      - EQ01.14
    tension: []
    dual: []
    applies:
      # 球谐函数/球 Bessel 在 CG05.1 中被使用。
      - CG05.1

  EQ01.16: # Legendre 方程
    prereq:
      # 「它依赖什么：EQ01.12（S-L 框架）、EQ01.13/EQ01.14（Frobenius；
      # x=±1 正则奇点）」，EQ01.15 为并行特例但统一视角前需要两个样本
      # （声明里 EQ01.15 出现在 EQ01.16 的依赖列表）。
      - EQ01.12
      - EQ01.13
      - EQ01.14
      - EQ01.15
    tension: []
    dual: []
    applies:
      # 球谐函数 P_l^m 由 Legendre 方程生成（CG05.1、PH16.1 角动量多处引用）。
      - CG05.1

  EQ01.17: # 特殊函数的统一视角
    prereq:
      # 统一视角=回头总结 Bessel/Legendre 两类正则奇点样本 + S-L 框架，
      # 声明一致列出 EQ01.12/EQ01.15/EQ01.16。
      - EQ01.12
      - EQ01.15
      - EQ01.16
    tension: []
    dual: []
    applies: []

  EQ01.18: # Green 函数方法（ODE 版本）
    prereq:
      # 「它依赖什么：EQ01.8（常数变易法——Green 函数是其「点源推广」，声明反复点名）、
      # EQ01.12（S-L 自伴框架，Green 函数的对称性来自自伴性）、EQ01.7（待定系数，
      # 分段拼解时的特解手段，两条声明列出）」。
      - EQ01.8
      - EQ01.12
      - EQ01.7
    tension: []
    dual: []
    applies: []

