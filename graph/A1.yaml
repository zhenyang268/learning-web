# graph/A1.yaml — 「A1 测度与积分」章的语义边真源（DESIGN §8.2 四类边）。
#
# 与派生边的关系（前端 renderers/graph.ts 的合并规则）：
#   派生边（索引里每条词条的 links → prereq/usedBy）是**启发式**：它只按代号数值序猜先后。
#   本文件是**真源**：凡是本章节点，prereq 以本文件为准（数值序的猜测被覆盖），
#   因为真实学习顺序不是数值序 —— A1.4（测度论基础）在编号上排第 4，
#   但它是 A1.2 勒贝格积分构造的**上游**（构造里处处用「可测集 / 可测空间」）。
#   若不覆盖就会得到 A1.2 ⇄ A1.4 的假环。
#
# 方向约定（渲染器、tools/check-graph.mjs 三方一致，改这里必须同步改那两处）：
#   prereq  Y ∈ X.prereq  ⟺ 有向边 Y → X（先学 Y 再学 X）。**全库必须无环**（否则 frontier 算不出）。
#   applies Y ∈ X.applies ⟺ 有向边 X → Y（X 被 Y 应用；Y 是本单元的下游）。允许成环。
#   tension Y ∈ X.tension ⟺ 无向冲突 X — Y（反例 / 约束互相打脸）。允许且常见。
#   dual    Y ∈ X.dual    ⟺ 无向对偶 X — Y（自顶向下 ↔ 自底向上）。允许。
# 无向边（tension/dual）只写一遍即可，双向都写也合法（校验脚本会对称去重）。
#
# 节点 = json/A1/ 下已存在的每个单元（A1.1–A1.5）。边内容从各单元 title/links/content 归纳，
# 宁少而真：每条边下面都注了依据。
notebook_commit: 9ca4702

nodes:
  A1.1: # 黎曼积分的本质与局限
    # 起点：没有前序。
    prereq: []
    tension:
      # 反例：逐点收敛但 ∫f_n ≡ 1 ↛ 0 = ∫f（A1.1:limit-exchange.bump，同一条被 A1.3 复用）。
      # 这条「失败的定理」正是三大收敛定理要修的东西 —— 两边互为张力。
      - A1.3
      # 反例：sin x/x（A1.2:sign-decomp.infty-infty）——广义黎曼收敛（π/2）而勒贝格不可积，
      # 黎曼与勒贝格两种积分观直接冲突。
      - A1.2
    dual:
      # 对偶切片：黎曼竖切定义域（区间 × 高度）↔ 勒贝格横切值域（水平集 × 精确高度）。
      - A1.2
    applies:
      # 下游：A1.2 的「黎曼 vs 勒贝格」总对照直接用本单元；A1.3 修本单元暴露的极限缺陷。
      - A1.2
      - A1.3

  A1.2: # 勒贝格积分的构造
    prereq:
      # 动机来源：先见过黎曼的局限，才谈得上换一种切片方式。
      - A1.1
      # 上游：四步构造/分层蛋糕处处要求 (X, M, μ)，即 A1.4 的可测空间与测度。
      - A1.4
    tension:
      - A1.1
    dual:
      - A1.1
    applies:
      # 下游：A1.3 的三大定理全部建立在「非负可测函数的积分」上；
      # A1.5 的 ‖f‖_p 是 ∫|f|^p，绝对值来自构造步骤④。
      - A1.3
      - A1.5

  A1.3: # 三大收敛定理（MCT / Fatou / DCT）
    prereq:
      # 工具链：MCT/Fatou/DCT 的每个积分都是 A1.2 的 sup 定义。
      - A1.2
      # 接缝：MCT（示性函数版）⟺ 可数可加，且证明里唯一用到测度性质的一步是下连续性。
      - A1.4
    tension:
      # A1.1 的 bump 是「无条件换序会失败」的反例，与本单元「有条件可换序」正面冲突。
      - A1.1
      # A1.4:general.banach —— 放弃可数可加后三条件全满足、却「无任何收敛定理」，直接打脸本单元三条。
      - A1.4
    dual: []
    applies:
      # 下游：A1.5 的 L^1/L^2 收敛与 Riesz–Fischer 完备性靠 DCT/MCT。
      - A1.5

  A1.4: # 测度论基础
    # 承重墙：地基单元，无前序。
    prereq: []
    tension:
      - A1.3
    dual: []
    applies:
      # 下游：A1.2 的构造、A1.3 的收敛定理、A1.5 的 L^p（全部住在可数可加上）。
      - A1.2
      - A1.3
      - A1.5

  A1.5: # L^p 空间
    prereq:
      # 定义里 ∫|f|^p 来自 A1.2；等价类 / 可测来自 A1.4；L^1 收敛来自 A1.3。
      - A1.2
      - A1.3
      - A1.4
    tension: []
    dual: []
    # 章内至此收口，跨章下游（C/F/H4…）由派生边（links）承担，不在此重复。
    applies: []
