# graph/A2.yaml — 「A2 泛函分析」章（A2.1–A2.5）语义边真源。
# schema、方向约定与派生边覆盖规则见 A1.yaml 头部（渲染器 / check-graph / graph-model 三方一致）。
# 语义依据：各单元 json 的 title / entries（statement/counterexample/comparison 条目）+ links。
notebook_commit: 9ca4702

nodes:
  A2.1: # 赋范空间与巴拿赫空间
    # 起点：把 A1.5 的 L^p 抽象成一般赋范空间，组内无前序（跨章上游 A1.5 由派生边承担）。
    prereq: []
    tension:
      # 平行四边形法则反例（‖·‖₁ 在 R² 上 8≠4）证明「有范数」≠「有内积」——
      # 巴拿赫框架装不下正交投影，两种空间观在 ℓ¹/R² 上冲突。
      - A2.2
      # δ 的尖峰逼近极限「不是函数」——跑出 A2.1 的函数空间（Banach）世界观，
      # A2.5 用测试函数对偶空间接住；「什么算函数」的两个世界打脸。
      - A2.5
    dual: []
    applies:
      # 下游：希尔伯特 = 完备内积空间（内积诱导范数）；算子范数 ‖T‖=sup‖Tx‖/‖x‖ 住在赋范空间语言里。
      - A2.2
      - A2.4

  A2.2: # 希尔伯特空间
    prereq:
      # 内积诱导范数 ‖x‖=√⟨x,x⟩、完备性沿用 Banach 定义——Hilbert 是 Banach 的特例。
      - A2.1
    tension:
      - A2.1
    dual: []
    applies:
      # 下游：正交基展开 / Parseval 能量守恒都住在内积结构上；谱定理（自伴）用正交性。
      - A2.3
      - A2.4

  A2.3: # 正交基与傅里叶分析
    prereq:
      # 展开定理 f=Σ⟨f,eₙ⟩eₙ 与 Parseval 都要求完备内积空间（C-S 给系数界）。
      - A2.2
    tension: []
    dual: []
    applies:
      # 下游：分布的「探测」读数与 Fourier 视角（δ 的谱 = 1）消费正交展开语言。
      - A2.5

  A2.4: # 有界线性算子与谱理论
    prereq:
      # 有界算子定义（一致有界、C 与 x 无关）需要赋范空间语言。
      - A2.1
      # 有限维谱定理（自伴 ⟹ 实特征值 + 正交特征向量）用内积与正交分解。
      - A2.2
    tension: []
    dual: []
    # 组内至此收口；跨章下游（H5 球谐、A4.5 Lax–Milgram、G3 形状分析…）由派生边承担。
    applies: []

  A2.5: # 分布（广义函数）
    prereq:
      # 分布 = 测试函数空间上的连续线性泛函；其典型计算（δ 的 Fourier 读数、弱-* 收敛）
      # 用 A2.3 的正交展开 / Fourier 视角，对照条目「函数/弱导数/分布三个世界」衔接 L² 框架。
      - A2.3
    tension:
      - A2.1
    dual: []
    # 组内收口；跨章下游（A4.2 弱导数、H2 镜面 BRDF、H7 点光源）由派生边承担。
    applies: []
