      - B2.4

  B2.3: # 黎曼几何
    prereq:
      # 绝妙定理（K 内蕴）是黎曼几何的动机：只靠第一基本形式（度量）就能算曲率。
      - B2.1
      # 黎曼度量 =「每个切空间上的内积光滑依赖于点」——主语是 B2.2 的 T_pM。
      - B2.2
    tension: []
    dual:
      - B2.1
    applies: []

  B2.4: # 纤维丛（Fiber Bundle）
    prereq:
      # 局部平凡化 / 图册语言来自流形；切丛 TM、余切丛 T*M 是主例（B2.2 的四件套）。
      # 不依赖 B2.3：丛结构不需要度量/曲率——莫比乌斯带反例只用到拓扑。
      - B2.2
    tension: []
    dual: []
    # 组内收口；跨章下游（lie 篇、E4 规范场、Q 篇）由派生边承担。
    applies: []
