nodes:
  B2.1: # 曲线与曲面
    # 起点：R³ 中嵌入曲面（外蕴）的经典微分几何——Frenet 标架、第一/第二基本形式、K 与 H。
    prereq: []
    tension: []
    dual:
      # 外蕴（嵌入视角：H 依赖怎么摆，平面卷柱面反例）↔ 内蕴（度量视角：K 蚂蚁可测）——
      # 绝妙定理正是两个视角的桥梁（K 用外蕴量表达、却是内蕴量）。
      - B2.3
    applies:
      - B2.2
      - B2.3

  B2.2: # 流形与切空间
    prereq:
      # 流形把「局部像 Rⁿ」从具体曲面中抽象出来；切空间 T_pM 推广曲面切平面。
      - B2.1
    tension: []
    dual: []
    applies:
      # 下游：黎曼度量定义在切空间上；切丛 TM 是纤维丛的第一例（B2.2 的 statement 点名 B2.4）。
