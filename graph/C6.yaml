# graph/C6.yaml — 「C6 收敛模式」章（C6.1–C6.5）语义边真源。
# schema、方向约定与派生边覆盖规则见 A1.yaml 头部。
notebook_commit: 9ca4702

nodes:
  C6.1: # 四种收敛模式
    # 起点：a.s. / 依概率 / L^p / 依分布四模式定义与层级关系，组内无前序。
    prereq: []
    tension:
      # 反例博物馆整章打脸层级图：四个箭头都不可逆（打字机/尖峰/iid 正态对三件展品
      # 各否定一条反向箭头）——「层级关系」与「箭头不可逆」正面冲突。
      - C6.2
    dual: []
    applies:
      # 下游：C6.2 的每件展品都对应 C6.1 的一条箭头；Vitali 要「依概率→L^1」入口；
      # Egorov/Scheffé 兑换 C6.1 层级图上缺失的箭头；BC 引理判 a.s. 收敛。
      - C6.2
      - C6.3
      - C6.4
      - C6.5

  C6.2: # 反例博物馆：为什么箭头不可逆
    prereq:
      # 展品逐条否定 C6.1 层级图的反向箭头——先有层级图，才有「不可逆」的展品。
      - C6.1
    tension:
      - C6.1
    dual: []
    applies:
      # 下游：Riesz 子列定理 / Skorokhod 表示是「修补门票」，为 C6.3 的 Vitali 证明铺路
      # （截断三分账里依概率→a.s. 子列的一步）；C6.5 的 SLLN 也吃 a.s. 收敛判定。
      - C6.3
      - C6.5

  C6.3: # 一致可积性：让「依概率」升到 L^1
    prereq:
      # Vitali 定理主语 =「依概率收敛 + UI ⟹ L^1」——两端的收敛模式来自 C6.1。
      - C6.1
      # UI 是「盖子的抽象化」：DCT 的可积盖子 ⟹ UI（充分不必要，1/x 切片反例）——
      # 反例博物馆的尖峰序列 n·1_[0,1/n] 正是 UI 否证展品。
      - C6.2
    tension: []
    dual:
      # 「依概率→L^1」的三个入口对照（Vitali / DCT / BCT）——UI 换掉盖子的对偶路线：
      # DCT 盯住函数列（给盖子），Vitali 盯住积分尾部（控质量），互为对偶判据。
      - C6.4
    applies:
      # 下游：C6.4 的 Scheffé 是反方向（积分收敛⟹L^1，不要盖子），与 Vitali 正面对照；
      # C6.5 的 WLLN→SLLN 升级吃 UI 判据。
      - C6.4
      - C6.5

  C6.4: # 三大定理之外的收敛定理
    prereq:
      # Egorov（a.e.≈一致）/Scheffé（积分⟹L^1）/单调类都建在 C6.1 的模式词汇上。
      - C6.1
      # Scheffé 与 Vitali 的分工对照（「三大定理之外」的入口表引用 UI）。
      - C6.3
    tension:
      - C6.3
    dual: []
    applies:
      # 下游：C6.5 的 BC 引理判 a.s. 事件频率，SLLN 证明里 Egorov 式的一致化思路登场。
      - C6.5

  C6.5: # Borel--Cantelli 与两种大数定律
    prereq:
      # SLLN 是 a.s. 收敛、WLLN 是依概率收敛——层级关系（SLLN⟹WLLN）来自 C6.1。
      - C6.1
      # BC 第一引理「ΣP(A_n)<∞ ⟹ a.s. 有限次」= a.s. 收敛的判据工具；
      # WLLN 的 Chebyshev 证明要 L^1/方差语言（C6.3 的 UI 视角判「均值是否收缩」）。
      - C6.3
    tension: []
    dual: []
    # 章内收口；跨章下游（C7.3 CLT、C8.1 遍历定理、C9.1 σ/√N）由派生边承担。
    applies: []
