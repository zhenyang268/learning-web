# graph/C7.yaml — 「C7 特征函数与中心极限定理」章（C7.1–C7.3）语义边真源。
# schema、方向约定与派生边覆盖规则见 A1.yaml 头部。
notebook_commit: 9ca4702

nodes:
  C7.1: # 定义与基本性质
    # 起点：φ(t)=E[e^{itX}] 定义、五条性质、Lévy 连续性定理，组内无前序。
    prereq: []
    tension:
      # 矩母函数 vs 特征函数分工对照：MGF 可能不存在（Cauchy/对数正态）而 φ 永远存在——
      # 两条「生成函数」路线在重尾分布上直接冲突（M 死 φ 活）。
      - C7.2
    dual: []
    applies:
      - C7.2
      - C7.3

  C7.2: # 算例：正态分布
    prereq:
      # φ_N(t)=e^{iμt−σ²t²/2} 是 C7.1 五条性质（线性变换、独立乘积）的具体落地；
      # 「Gaussian 是 Fourier 变换的不动点」用 φ 的语言陈述。
      - C7.1
    tension:
      - C7.1
    dual: []
    applies:
      # 下游：CLT 的极限正是 N(0,1)——「为什么 e^{−t²/2} 是唯一可能的极限」条目点名 C7.3。
      - C7.3

  C7.3: # 中心极限定理（CLT）
    prereq:
      # 证明三步「标准化→Taylor→取幂」：φ 的 Taylor 展开与连续性定理（C7.1）是引擎；
      # 极限分布的 φ 就是 C7.2 算出的 e^{−t²/2}。
      - C7.1
      - C7.2
    tension: []
    dual: []
    # 组内收口；跨章下游（C9.1 σ/√N 误差量级、H4 MC 积分、P8.4 Stirling 互证）由派生边承担。
    applies: []
