      # 二阶矩无穷反例（E[Y²]=∞ ⟹ CLT 无右端、样本方差不收敛）——
      # σ/√N 的误差量级结论当场失效，与「误差恰好是 σ/√N」的直觉正面冲突。
      - C9.2
    dual: []
    applies:
      - C9.2

  C9.2: # 方差缩减技术
    prereq:
      # 六项技术（重要性/分层/对偶/控制变量/MIS/俄式轮盘）全部以 C9.1 的方差公式
      # Var = σ²/N 为靶子——先知道误差量级从哪来，才谈得上缩减它。
      - C9.1
    tension:
      - C9.1
    dual: []
    # 组内收口；跨章下游（H4 MC 积分、H6 QMC、C10 Itô）由派生边承担。
    applies: []
