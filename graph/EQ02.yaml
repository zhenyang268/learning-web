# graph/de2.yaml — 「EQ02 对称性与 PDE」章语义边真源（只覆盖派生边出错的单元）。
# schema、方向约定与派生覆盖规则见 A1.yaml 头部。
#
# 本组 2026-09-25 入库至 EQ02.15（EQ02 全章 15 单元齐）；EQ03 / EQ04 仍在并行生成，入库后再回来补。
# EQ02 分两条独立轨道：
#   · 对称性轨道 EQ02.1–EQ02.4（李群 → 对称性条件 → 标准解法 → 降阶步骤）——
#     派生边（组内编号递进 + EQ01 交叉）方向正确，**不覆盖**，交给派生；
#   · PDE 轨道 EQ02.5 起（分类 → 波动 → 热 → Laplace → 边界条件 → 解法 → 变分）——
#     与对称性轨道**无前置关系**，但「同组编号递进」派生给 EQ02.5–EQ02.15
#     挂上了整条对称性轨道假前置，必须覆盖。
notebook_commit: 62a761e

nodes:
  EQ02.5: # 二阶线性 PDE 的分类
    prereq:
      # 「PDE 轨道的起点」：判别式 B^2−4AC 分椭圆/抛物/双曲，与 EQ01.5 的特征方程
      # 是同一「常系数二阶」语言（EQ02.5 有一条声明提到 EQ01.5）。
      # EQ02.1–EQ02.4（对称性降阶轨道）与 PDE 分类是并行轨道，同组递进为噪声，剥。
      - EQ01.5
    tension: []
    dual: []
    applies:
      # 下游：波动方程（双曲型）直接用本单元的分类结论；AN11.1「二维为什么特殊」
      # 也以本分类为框架（AN11.1 侧 prereq 已声明，这里不重复写 AN11.1）。
      - EQ02.6

  EQ02.6: # 波动方程（双曲型）
    prereq:
      # 双曲型是 EQ02.5 分类的三类之一；d'Alembert 公式的特征线方法与
      # EQ01.5 的特征方程同源（一条声明提到 EQ01.5，传依赖经 EQ02.5 承担，不重复）。
      - EQ02.5
    tension: []
    dual: []
    applies: []

  EQ02.7: # 热方程（抛物型）
    prereq:
      # 三类原型方程之二，抛物型；EQ02.5 的分类在全部声明里出现（8/8）。
      # 与 EQ02.6 是并列原型（传播 vs 扩散），不是前置——d'Alembert 解法
      # 用不到热方程，互引属对照，不建边。
      - EQ02.5
    tension: []
    dual: []
    applies: []

  EQ02.8: # Laplace 方程（椭圆型）
    prereq:
      # 三类原型之三，椭圆型；EQ02.5（8/8）、EQ02.7（声明稳定前位，
      # 三原型按波动→热→Laplace 顺序讲）。
      # 跨章：EQ01.18（Green 函数 ODE 版本）——Laplace 的 Green 函数表示
      # 正是其 PDE 推广，方法原型来自 EQ01.18（声明 4/9 点名）。
      - EQ02.5
      - EQ02.7
      - EQ01.18
    tension: []
    dual: []
    applies: []

  EQ02.9: # 边界条件
    prereq:
      # 三类原型讲完后才能谈「定解条件」（Dirichlet/Neumann 挂在具体方程上）；
      # 声明核心 EQ02.5（分类框架）、EQ02.8（6/8，椭圆型边值问题是最标准的例子）。
      - EQ02.5
      - EQ02.8
    tension: []
    dual: []
    applies: []

  EQ02.10: # 分离变量法
    prereq:
      # 声明核心三件：EQ02.7（8/8，热方程是标准载体）、EQ02.9（7/8，先有边界条件
      # 才有特征值问题）、EQ01.12（8/8——分离变量把 PDE 化成 Sturm–Liouville
      # 特征问题，这是本章最关键的跨章边）。
      # EQ01.15/16/17（柱面/球面坐标分离出 Bessel/Legendre）经 EQ01.12 承担，不重复。
      - EQ02.7
      - EQ02.9
      - EQ01.12
    tension: []
    dual: []
    applies: []

  EQ02.11: # 特征线法（双曲型）
    prereq:
      # 双曲型的通法：EQ02.5（7/8）、EQ02.6（8/8——特征线法是 d'Alembert
      # 解法的推广）。EQ02.9（初值数据挂在特征线上）为传依赖，不重复。
      - EQ02.5
      - EQ02.6
    tension: []
    dual: []
    applies: []

  EQ02.12: # Fourier 变换
    prereq:
      # 无界域上解热方程的变换法：EQ02.7（8/8）、EQ02.10（8/8，与分离变量
      # 并列的解法轨道）。EQ02.13 是下游（Laplace 变换声明依赖本单元），不写。
      - EQ02.7
      - EQ02.10
    tension: []
    dual: []
    applies:
      - EQ02.13

  EQ02.13: # Laplace 变换
    prereq:
      # EQ02.12（8/8，变换法同族）；跨章 EQ01.11（6/8——Laplace 变换把
      # 微分方程化代数方程后按极点位置读稳定性，正是 EQ01.11 的语言）。
      - EQ02.12
      - EQ01.11
    tension: []
    dual: []
    applies: []

  EQ02.14: # Green 函数方法（PDE 版本）
    prereq:
      # 声明三件全票：EQ02.8（8/8，椭圆型边值问题是最标准应用）、
      # EQ02.9（7/8，边值问题框架）、EQ01.18（8/8——ODE 版 Green 函数的
      # PDE 推广，方法原型直接继承）。
      - EQ02.8
      - EQ02.9
      - EQ01.18
    tension: []
    dual: []
    applies: []

  EQ02.15: # 变分法与弱解
    prereq:
      # EQ02.14（8/9，Green 函数→变分形式的桥）、EQ02.8/EQ02.9（椭圆边值问题
      # 是弱解的标准舞台）；跨章 AN04.5（9/9 全票——「弱解与 Lax–Milgram」
      # 正是本单元的泛函引擎，本章最重的一条跨章边）。
      - EQ02.14
      - EQ02.8
      - EQ02.9
      - AN04.5
    tension: []
    dual: []
    applies: []
