# graph/G1.yaml — 「G1 时间积分」章（G1.1–G1.2）语义边真源。
# schema、方向约定与派生边覆盖规则见 A1.yaml 头部。
notebook_commit: 9ca4702

nodes:
  G1.1: # 经典 RK4
    # 起点：四阶显式 Runge–Kutta + 稳定域（刚性受限），组内无前序。
    prereq: []
    tension:
      # 「让步长只由精度决定 → 刚性方程会爆」——RK4 显式格式的结构缺陷，
      # 正是辛积分器（保相空间面积、能量有界）要绕开的东西：精度导向 vs 结构导向冲突。
      - G1.2
    dual: []
    applies:
      # 下游：辛格式的对照基准是「非辛格式」（显式 Euler/RK4）——先认识 G1.1 才读得懂
      # 「辛格式与非辛格式的分工」与「显式 Euler 长时程能量涨 5000%」反例。
      - G1.2

  G1.2: # 辛积分器
    prereq:
      # 「单元级对照：辛格式与非辛格式的分工」——非辛一侧就是 G1.1 的 RK4/Euler；
      # 反例「显式 Euler 长时程能量涨」直接对照显式格式。
      - G1.1
    tension:
      - G1.1
    dual:
      # RK4（局部精度：四次采样模拟 Taylor 四阶，步长受稳定域限）↔
      # 辛积分器（全局结构：Verlet/Leapfrog 把相空间面积当硬约束，能量在环上有界摆动）——
      # 同一 ODE 的两种离散哲学：追精度 vs 保结构，互为对偶。
      - G1.1
    # 组内收口；跨章下游（H8.2 刚体姿态积分、de4 ODE、M 篇分子动力学）由派生边承担。
    applies: []
