# graph/G2.yaml — 「G2 空间离散化」章（G2.1–G2.3）语义边真源。
# schema、方向约定与派生边覆盖规则见 A1.yaml 头部。
notebook_commit: 9ca4702

nodes:
  G2.1: # 有限差分法（FDM）
    # 起点：差分公式/精度阶/CFL + 迎风格式，组内无前序。
    prereq: []
    tension:
      # 迎风格式（单侧差分）能处理激波/对流，而谱方法（G2.3）遇激波 Gibbs 振荡不收敛——
      # 局域单侧 vs 全局光滑基在间断处正面对立。
      - G2.3
    dual: []
    applies:
      # 下游：FEM/谱方法的「分工对照」都以 FDM 为参照系（G2.1 的「与相邻离散化方法对照」
      # + G2.3 的「谱方法与差分的精度差多少」）。
      - G2.2
      - G2.3

  G2.2: # 有限元法（FEM）
    prereq:
      # 学习顺序与对照基准：FEM 的定位（弱形式/变分）在与 FDM（强形式/逐点差分）的对照中确立。
      - G2.1
    tension: []
    dual:
      # FDM（强形式逐点差分，网格自由）↔ FEM（弱形式变分 + 基函数，分部积分降阶）——
      # 同一 PDE 的两条离散路线，G2.1/G2.2 各自的「分工对照」条目点名这对镜像。
      - G2.1
    applies: []

  G2.3: # 谱方法
    prereq:
      # 「谱方法与差分的精度差多少」——以 FDM（G2.1）的代数收敛为参照，凸显谱方法的指数收敛。
      - G2.1
    tension:
      - G2.1
    dual:
      # 局域（FDM：每点只看邻域，激波友好）↔ 全局（谱：少数几个波描述整个解，光滑问题指数收敛
      # 但激波 Gibbs）——离散支撑域的两个极端，互为对偶。
      - G2.1
    # 组内收口；跨章下游（A2.3 正交基/Fourier、I9 数值格式、H5 球谐谱）由派生边承担。
    applies: []
