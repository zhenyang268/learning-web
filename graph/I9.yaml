# graph/I9.yaml — 「I9 数值格式」章（I9.1–I9.4）语义边真源。
# schema、方向约定与派生边覆盖规则见 A1.yaml 头部。
notebook_commit: 9ca4702

nodes:
  I9.1: # 有限体积法——天然守恒
    # 起点：FVM 通量记账（dM/dt = 边界通量差），组内无前序。
    prereq: []
    tension: []
    dual:
      # FVM vs FD 分工对照（「怎么选」条目）：守恒由构造保证（通量两面记两次）↔
      # 守恒靠格式凑（中心差/迎风各自为政）——同解 PDE 的两套离散哲学。
      - I9.2
    applies:
      # 下游：能量稳定的唯一来源 =「同一笔通量被记两次、符号相反」（I9.2 直觉条目原话）；
      # 投影法的通量形式也住在 FVM 记账上；CFL 约束的对象是 FVM 的面通量。
      - I9.2
      - I9.3
      - I9.4

  I9.2: # 能量稳定格式
    prereq:
      # 「能量守恒的唯一来源是同一笔通量被记两次」（I9.1 的记账）；
      # 反例「守恒形式 ∇·(uu) 说能量稳定实际在造能量」——守恒≠能量稳定，先分清 I9.1 给了什么。
      - I9.1
    tension: []
    dual:
      - I9.1
    applies:
      # 下游：散度自由保持的投影步要用能量视角判稳（I9.3.prereq 含本单元）；
      # 时间步约束里的能量视角（显式格式的能量增长因子 |G|）用到本单元的 G 分析。
      - I9.3
      - I9.4

  I9.3: # 散度自由条件的保持
    prereq:
      # 投影法 = Helmholtz 分解 + 压力 Poisson；棋盘振荡反例的主语是「同位网格 + 中心差」——
      # 中心差格式来自 I9.2 的三种对流形式对照。
      - I9.2
    tension: []
    # 注：「速度-压力路线（投影）↔ 涡量路线（流函数/约束输运）」的对偶在 I9.3 单元内部，
    # 不产生跨节点边；单元内分工对照已覆盖。
    dual: []
    applies:
      # 下游：投影法每步的 Δt 受 Poisson 求解与 CFL 双重约束（I9.4 的四类约束表）。
      - I9.4

  I9.4: # 时间步长约束
    prereq:
      # 四类约束（CFL/粘性/表面张力/外力）的对象全部是前面三节建好的离散格式：
      # 通量（I9.1）、能量增长因子（I9.2）、投影步（I9.3）。
      - I9.1
      - I9.2
      - I9.3
    tension: []
    dual: []
    # 组内收口；跨章下游（H8.1 Stable Fluids、de4 数值积分）由派生边承担。
    applies: []
