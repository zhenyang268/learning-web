# graph/J5.yaml — 「J5」组语义边真源（跨组依赖）。
# schema、方向约定与派生边覆盖规则见 A1.yaml 头部。
#
# 本文件的边来自**数据里的显式声明块**（词条 statement 的「它依赖什么 / 谁依赖它」），
# 且经双向印证（下游说「依赖 X」+ 上游说「下游：本单元」两侧独立互认）。
