# graph/P1.yaml — 「P1 求和」章（P1.1–P1.4）语义边真源。
# schema、方向约定与派生边覆盖规则见 A1.yaml 头部。
notebook_commit: 9ca4702

nodes:
  P1.1: # 核心思想：差分法（telescoping）
    # 起点：望远镜求和 Σ(F(k+1)−F(k))=F(n+1)−F(1)——全章的发动机，组内无前序。
    prereq: []
    tension: []
    dual: []
    applies:
      # 下游：幂和三公式的 F 全部由差分法找出；∑k² 推导示范是差分法的完整走一遍；
      # 裂项相消/错位相减都是 telescoping 的变体。
      - P1.2
      - P1.3
      - P1.4

  P1.2: # 必备公式
    prereq:
      # 「三公式的 F 一览（差分/证明列转写）」——公式是差分法的产出，不是公理。
      - P1.1
    tension: []
    dual: []
    applies:
      # 下游：P1.3 的升阶套路以幂和公式为对照（两条产出 ∑k² 的路线）；
      # P1.4 的 ∑↔∫ 放缩用幂和做夹逼对拍。
      - P1.3
      - P1.4

  P1.3: # 推导示范（∑k²，必须会复述）
    prereq:
      # 升阶差分套路 = 差分法（P1.1）的高阶形态；∑k² 完整推导要会背，公式本体在 P1.2。
      - P1.1
      - P1.2
    tension: []
    dual: []
    applies:
      - P1.4

  P1.4: # 常用技巧
    prereq:
      # 裂项相消 = telescoping 变体；错位相减（等差×等比）= 差分思想的等比版；
      # ∑↔∫ 放缩与 P1.2 的幂和主导项对账。
      - P1.1
      - P1.2
      - P1.3
    tension: []
    dual: []
    # 组内收口；跨章下游（P4.1 数列、P8.4 Stirling 的 Σln k→∫ln x、C 篇误差量级）由派生边承担。
    applies: []
