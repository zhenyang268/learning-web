# graph/P2.yaml — 「P2 代数变形」章（P2.1–P2.5）语义边真源。
# schema、方向约定与派生边覆盖规则见 A1.yaml 头部。
notebook_commit: 9ca4702

nodes:
  P2.1: # 乘法公式族（【必】）
    # 起点：五条展开公式（平方差/完全平方/立方和差…），组内无前序。
    prereq: []
    tension: []
    dual:
      # 正向展开（乘法公式：(a+b)² → a²+2ab+b²）↔ 逆向分解（因式分解：多项式 → 因式乘积）——
      # P2.3 的「与 P2.1 的分工」条目点名这对互逆操作。
      - P2.3
    applies:
      - P2.2
      - P2.3

  P2.2: # 配方（【必】）
    prereq:
      # 配方 = 完全平方公式的逆用（凑出 (x+b/2a)² 项）；「配方 vs 因式分解 vs 对角化」对照引用 P2.1/P2.3。
      - P2.1
    tension: []
    dual: []
    applies:
      - P2.3
      - P2.4

  P2.3: # 因式分解与多项式（【熟】）
    prereq:
      # 因式分解工具箱（提公因式/十字相乘/分组）是乘法公式的逆向；配方法是其核心工具。
      - P2.1
      - P2.2
    tension: []
    dual:
      - P2.1
    applies:
      # 下游：部分分式分解的前提是分母能因式分解（实根/共轭复根/重根四类块）。
      - P2.4

  P2.4: # 部分分式分解（【必】· 积分／Laplace／传递函数全靠它）
    prereq:
      # 分解步骤「通分→比较系数」用乘法公式；分母因式分解来自 P2.3（重根阶梯项）。
      - P2.2
      - P2.3
    tension: []
    dual: []
    # 组内收口（P2.5 不依赖部分分式）；跨章下游（P7.2 有理函数积分、P7.3 小表、
    # de2.13 Laplace 逆变换、R 篇传递函数）由派生边承担。
    applies: []

  P2.5: # 根式、指数与对数（【必】）
    prereq:
      # 双重根式化简靠配方（√(a+2√b) 型）；有理化 = 平方差公式的逆用。
      - P2.1
      - P2.2
    tension: []
    dual: []
    # 组内收口；跨章下游（P4.2 等价无穷小、P7.2 积分、P8.2 Γ）由派生边承担。
    applies: []
