nodes:
  P4.1: # 数列
    # 起点：等差等比求和、特征根法、单调有界定理，组内无前序。
    prereq: []
    tension: []
    dual: []
    applies:
      # 下游：极限三件套的「数列版」极限（n→∞）以数列收敛词汇为前提；
      # (1+1/n)^n 的证明用「单调有界」（P4.1 的定理）。
      - P4.2
      - P4.3

  P4.2: # 极限三件套（【必】）
    prereq:
      # 等价无穷小/Taylor/洛必达都处理 x→0 或 n→∞ 的极限——先有极限概念（数列版在 P4.1）。
      - P4.1
    tension: []
    dual: []
    applies:
      # 下游：常用极限 (1+x/n)^n→e^x 的证明 = Taylor 展开 ln + 等价无穷小替换。
      - P4.3

  P4.3: # 常用极限（【必】）
    prereq:
      # (1+1/n)^n→e 证明用「二项式展开 + 单调有界」（P4.1）；
      # n^{1/n}→1 证明用「取对数 + ln t ≤ t−1」（P4.2 的放缩 / P3.2 盒子）；
