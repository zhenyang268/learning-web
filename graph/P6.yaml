# graph/P6.yaml — 「P6 线性代数计算」章（P6.1–P6.4）语义边真源。
# schema、方向约定与派生边覆盖规则见 A1.yaml 头部。
notebook_commit: 9ca4702

nodes:
  P6.1: # 行列式（【必】）
    # 起点：2×2/3×3 Sarrus、四性质、Vandermonde，组内无前序。
    prereq: []
    tension: []
    dual: []
    applies:
      # 下游：特征值 = det(A−λI) 的根（行列式是特征多项式的引擎）；
      # 可逆四等价里 det≠0 是一员；2×2 求逆公式的分母就是 det。
      - P6.2
      - P6.3

  P6.2: # 消元与求逆（【必】）
    prereq:
      # 换行变号/行倍乘等性质是消元的理论根据；2×2 求逆公式分母 = det。
      - P6.1
    tension: []
    dual: []
    applies:
      # 下游：QR 分解 = Gram–Schmidt 的矩阵形式（消元思想的「正交版」，正交化是消元在
      # 内积几何里的镜像——列空间逐步清理）；SVD 迷你版的 λᵢ(AᵀA) 也要会解方程。
      - P6.4

  P6.3: # 特征值与二次型（【必】／【熟】）
    prereq:
      # 特征值求法 det(A−λI)=0 直接消费行列式计算（P6.1）。
      - P6.1
    tension: []
    dual: []
    applies:
      # 下游：SVD 迷你体验 σᵢ=√λᵢ(AᵀA)——特征值是 SVD 的前半程。
      - P6.4

  P6.4: # 正交化（【熟】）
    prereq:
      # QR 是「消元/求逆」路线的正交化版（A=QR 的 R 来自逐步投影）；
      # SVD 迷你体验 σᵢ=√λᵢ(AᵀA) 需要先会算特征值。
      - P6.2
      - P6.3
    tension: []
    dual:
      # 消元（LU：斜着把矩阵打直，保行空间）↔ 正交化（QR：旋转着把基打正，保角度）——
      # 同一件事「整理一组向量」的两种几何：切变 vs 旋转。
      - P6.2
    # 组内收口；跨章下游（A2.2/A2.3 正交分解与正交基、A2.4 谱定理、H1 离散微分几何）由派生边承担。
    applies: []
