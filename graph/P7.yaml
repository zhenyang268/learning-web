# graph/P7.yaml — 「P7 微积分手艺」章（P7.1–P7.5）语义边真源。
# schema、方向约定与派生边覆盖规则见 A1.yaml 头部。
notebook_commit: 9ca4702

nodes:
  P7.1: # 必背 Maclaurin 表（【必】）
    # 起点：e^x/sin/cos/ln(1+x)/(1−x) 五张展开 + 收敛半径，组内无前序。
    prereq: []
    tension: []
    dual: []
    applies:
      # 下游：积分技术的「循环积分」「万能替换」对拍用展开验算；
      # 原函数小表的推导（如 ∫ln x）用分部 + 展开对照。
      - P7.2
      - P7.3

  P7.2: # 积分技术（【必】）
    prereq:
      # 分部积分表格法/循环积分的验算用 Maclaurin 展开；部分分式积分（四类基本块）
      # 的系数确定依赖展开对照。
      - P7.1
    tension: []
    dual: []
    applies:
      # 下游：小表六条原函数全部由 P7.2 的五技法生产（「背三条生产线，不背六个孤立公式」）。
      - P7.3
      - P7.4

  P7.3: # 常用原函数小表（【必】）
    prereq:
      # 「六条各来自哪条生产线」= P7.2 的换元/分部/部分分式。
      - P7.2
    tension: []
    dual: []
    applies:
      # 下游：多重积分换元后逐层套一维原函数；球坐标体积积分用 ∫sinθ。
      - P7.4

  P7.4: # 多重积分（【熟】）
    prereq:
      # Fubini 逐层积分 = 一维原函数（P7.3）× 维数；极坐标/球坐标算例落地用它。
      - P7.3
    tension: []
    dual: []
    applies:
      # 下游：微分章的「梯度全家」与多重积分互为逆运算视角（散度定理一侧）；
      # Jacobian 行列式的推导用偏导法则（P7.5 的求导清单）。
      - P7.5

  P7.5: # 微分（【必】）
    prereq:
      # Jacobian/梯度的计算用多元求导法则；「隐函数求导」与多重积分换元的 J 互证。
      - P7.4
    tension: []
    dual:
      # 微分（局部线性化：全微分 du = ∇u·dx）↔ 积分（全局累积：∫ 把局部拼回整体）——
      # Newton–Leibniz 的两端，P7.2/P7.4 与 P7.5 互为逆过程。
      - P7.2
    # 组内收口；跨章下游（P9.1 分部积分、A4.2 弱导数、I2 应力张量）由派生边承担。
    applies: []
