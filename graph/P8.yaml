nodes:
  P8.1: # 高斯积分（【必】· 全分析最有名的技巧）
    # 起点：∫e^{−x²}dx=√π（平方换维度 + 极坐标），组内无前序。
    prereq: []
    tension: []
    dual: []
    applies:
      # 下游：Γ(1/2)=√π 的换元证明直接落地高斯积分（「同一个数的两种算法」对照条目）；
      # Stirling 的 √(2πn) 常数来自高斯型积分。
      - P8.2
      - P8.4

  P8.2: # Γ 函数（Euler 第二积分）（【必】）
    prereq:
      # Γ(1/2)=√π 的证明 = 换元 t=x² 后就是高斯积分（P8.1 条目「高斯积分 vs Γ」点名）。
      - P8.1
    tension: []
    dual:
      # Γ（第二积分，半无穷轴 ∫₀^∞ x^{s−1}e^{−x}dx）↔ B（第一积分，单位区间
      # ∫₀¹ t^{x−1}(1−t)^{y−1}dt）——「把两个半无穷对折成一个单位区间」互为镜像，
      # B(x,y)=Γ(x)Γ(y)/Γ(x+y) 是桥。
      - P8.3
    applies:
      # 下游：B 的核心公式 B=ΓΓ/Γ 全部消费 Γ 的性质；Stirling 是 n! = Γ(n+1) 的渐近。
      - P8.3
      - P8.4

  P8.3: # Beta 函数（Euler 第一积分）（【熟】）
    prereq:
      # 三条核心公式之首 B(x,y)=Γ(x)Γ(y)/Γ(x+y)——Γ 是其定义性依赖。
      - P8.2
    tension: []
    dual:
      - P8.2
    applies:
      # 下游：Stirling 证明（Euler–Maclaurin）里 B 与 Γ 的比值给 √(2πn) 常数供料
      # （「半整数特例全家桶」条目）。
      - P8.4

  P8.4: # Stirling 公式（【熟】）
    prereq:
      # n! = Γ(n+1)——Stirling 是 Γ 的渐近展开；√(2πn) 的常数来自高斯积分
      # （∫e^{−x²/2} 型 Laplace 方法），「什么时候掏 Stirling 什么时候掏 Γ」对照条目点名 P8.1/P8.2。
      - P8.1
      - P8.2
      - P8.3
    tension: []
    dual: []
    # 组内收口；跨章下游（C6.5 大数律误差、C7.3 局部 CLT 互证、C8.3 Pólya 返回概率、P9.3 渐近记号）由派生边承担。
    applies: []
