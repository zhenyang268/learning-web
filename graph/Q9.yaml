  Q9.2: # 同调群与 Betti 数
    prereq:
      # 组内：适用条件表第①条「H_k = ker ∂_k / im ∂_{k+1}，**需要 ∂²=0**
      # （否则 im ⊄ ker，商无定义）」；statement 也自陈「它依赖 Q9.1 的 ∂」。
      - Q9.1
      # 跨章：H_k 本身是**商群**（「闭链模去边界」），需要 Q7 的商空间语言；
      # statement 的「与 Q7 的接口」条目还记录了 Q7:quotient.proof 用 χ=b0−b1+b2
      # 核对过六种商空间（两组计算一致）。
      - Q7
    tension: []
    dual:
      # 组合侧 χ = V−E+F ↔ 同调侧 χ = Σ(−1)^k b_k：proof 第三步「校核（Euler 特征的
      # 自洽）」正是把两条定义对齐（「这条恒等式是秩–零化度定理的直接后果」）。
      - Q9.3
    applies:
      - Q9.3

  Q9.3: # Euler 特征
    prereq:
      # 跨章/组内：application 明确「χ 的良定义依赖 ∂²=0」——即 Q9.1 的边界算子。
      # 组合定义 χ=V−E+F 本身可独立陈述，但其良定义性（与剖分无关）由 ∂²=0 保障。
      - Q9.1
    # 注：反例「对不可定向曲面用 χ=2−2g」与「角度亏损之和 ≠ 2πχ（网格有缺陷）」
    # 都在打本单元两条公式的适用条件，属 Q9.3 单元内部，不建跨节点边。
    tension: []
    dual:
      - Q9.2
    # 组内收口；跨章下游（Q7 切割图、M6 的 DEC、H1 离散微分几何、lie3 拓扑应用）
