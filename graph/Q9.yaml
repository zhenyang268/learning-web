nodes:
  Q9.1: # 链条与边界算子
    # 起点：链条 + 边界算子 ∂ + ∂²=0（含三步标准证明），组内无前序。
    prereq: []
    # 注：反例「忘掉边界算子的符号（∂²≠0）」与「Z 系数 vs Z/2 系数」的分工对照
    # 都在 Q9.1 单元内部，不构成跨节点边。
    tension: []
    dual: []
    applies:
      # 下游：Q9.2 的同调群 H_k = ker ∂ / im ∂ 直接消费 ∂ 与 ∂²=0；
      # Q9.3 的 application 明确「χ 的良定义依赖 ∂²=0」。
      - Q9.2
