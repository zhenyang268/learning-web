# graph/R2.yaml — 「R2 Cauchy 理论」章（R2.1–R2.4）语义边真源。
# schema、方向约定与派生边覆盖规则见 A1.yaml 头部。
# 跨章端点只写已入库者（R6/R7/R8 尚未入库，其关系由「被用于」栏 links 派生承担）。
notebook_commit: 9ca4702

nodes:
  R2.1: # 围道积分
    # 起点：围道积分 = 参数化把复积分化成普通积分，不需要全纯性即可定义，组内无前序。
    prereq: []
    tension: []
    # 注：「z 的幂沿单位圆积分：只有 z^(-1) 存活」（dz/z=i dθ）既是本单元的计算结果，
    # 也是 R2.2「2πi 是洞的度量」的雏形，但对照在 R2.1 单元内部，不建跨节点边。
    dual: []
    applies:
      # 下游：R2.2 的 Cauchy 定理、R2.3 的积分公式都以围道积分为语言
      # （R2.3 statement 自陈「依赖 R2.1 的 ∮dz/z=2πi」）。
      - R2.2
      - R2.3

  R2.2: # Cauchy 积分定理
    prereq:
      # 组内：定理主语是「沿闭回路的围道积分」，语言来自 R2.1。
      - R2.1
      # 跨章：statement/proof 明确「f dz 是闭 1-形式，由 C-R 方程——R1 的两式
      # 正是 d(f dz)=0」；proof 第二步「C-R 方程给 u_y=−v_x ⇒ 被积函数为 0」。
      # 全纯性（R1）是定理成立的实质前提，不是相关引用。
      - R1
    # 注：反例「在非单连通域上用 Cauchy 定理」（1/z 在 C∖{0} 上全纯却 ∮=2πi≠0）
    # 与「全纯 ⇒ 积分为零」的朴素陈述正面冲突（漏了单连通条件），但在 R2.2 单元内部。
    tension: []
    dual: []
    applies:
      # 下游：R2.3 的积分公式「从 Cauchy 定理推出」（proof 第一步「挖掉小圆盘，
      # 应用 R2.2 的关键技巧」）。
      - R2.3

  R2.3: # Cauchy 积分公式
    prereq:
      # statement/comparison 两处自陈「它依赖什么：R2.1 的 z^(-1) 积分、R2.2 的 Cauchy 定理」；
      # proof 第一步「挖掉小圆盘（应用 R2.2 的关键技巧）」。
      - R2.1
      - R2.2
    # 注：反例「把 a 取在曲线外部」（圆外奇点时积分应为 0 而非 2πi f(a)）打的是公式
    # 适用条件；「边界决定内部」的刚性（0 阶积分公式 ↔ n 阶求导形式）也是单元内对照。
    # 两者都在 R2.3 单元内部，不建跨节点边。
    tension: []
    dual: []
    applies:
      # 下游：R2.4 的三个推论「都用 f^(n) 的 Cauchy 求导形式（R2.3）」；
      # R3 的 Taylor/Laurent 展开以「全纯 ⇒ 无穷可微」为前提（R2.4 application 转述）。
      - R2.4
      - R3

  R2.4: # 三个经典推论（Liouville / 代数基本定理 / 最大模原理）
    prereq:
      # comparison 第④条「共同工具：三个都用 f^(n) 的 Cauchy 求导形式（R2.3）」；
      # proof「Liouville 第一步：用求导形式表示 f'(a)，取 R2.3 的求导形式 n=1」。
      - R2.3
    # 注：反例「把无界整函数当常数（e^z 无界）」打的是 Liouville 的「有界」条件，
    # 在 R2.4 单元内部，不建跨节点边。
    tension: []
    dual: []
    # 组内收口；跨章下游（R3 幂级数、R6 唯一性、R7 平均值性质、A2.5 分布）
    # 由「被用于」栏（links 派生）承担。
    applies: []
