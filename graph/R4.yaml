notebook_commit: 9ca4702

nodes:
  R4.1: # 定义与定理
    prereq:
      # 跨章：留数的**定义**就是「Laurent 展开中 (z−a)^(−1) 的系数 c_(−1)」——
      # 没有 R3 的 Laurent 级数，这个定义无从谈起；适用条件表第①条也点名
      # 「孤立性是 Laurent 展开的前提（R3）」，反例「对支点用留数（log z 在 0）」
      # 正因支点没有 Laurent 展开。
      - R3
      # 跨章：proof 第一步「R2.2:…proof 的『两回路之差』技巧的多回路版」；
      # probe 第 3 问「圆内无奇点 ⇒ Cauchy 定理给 0」引 R2.3 的 wrong-location 反例。
      # 留数定理是 Cauchy 定理的「有奇点」推广，二者是前置关系而非相关引用。
      - R2.2
      - R2.3
    # 注：反例「对支点用留数」（log z / √z 绕一圈变支，Laurent 不存在）与本单元
    # 「孤立奇点才有留数」的断言正面冲突，但在 R4.1 单元内部，不建跨节点边。
    tension: []
    dual: []
    applies:
      # 下游：R4.2 的三条公式是「怎么算出这个 c_(−1)」；
      # R4.3 的实积分套路第三步直接「留数定理」（∮ = 2πi ΣRes）。
      - R4.2
      - R4.3

  R4.2: # 怎么算留数
    prereq:
      # comparison 自陈「它依赖什么：R4.1 的留数定义、R3 的奇点分类（阶数的判定）」；
      # proof 目标「从 Laurent 导出三条公式」，第一步就写 m 阶极点的 Laurent 展开；
      # 「数阶数的两种方法」之一 = 看 Laurent 最低负幂。
      - R4.1
      - R3
    # 注：反例「对高阶极点用单极点公式」打的是三条公式的使用顺序，在 R4.2 单元内部。
    tension: []
    dual: []
    applies:
      # 下游：R4.3 的三类实积分「都要算留数」（comparison 自陈）。
      - R4.3

  R4.3: # 三类实积分的标准套路
    prereq:
      # intuition「补上半圆使它闭合——然后**留数定理**直接给答案」、
      # proof 第三步「留数定理：四阶分母 1+z^4=0 ⇒ 极点…」→ 需要 R4.1。
      - R4.1
      # statement「辐角原理为什么成立：f'/f 在每个单零点给留数 +1、单极点给 −1
      # （R4.1:residue.extension）⇒ 留数定理直接给 Z−P」，而 Z−P 的具体数值
      # 要用 R4.2 的公式算（两个计数工具都建立在会算留数之上）。
      - R4.2
      # 跨章：「把实轴当成围道的一部分」——围道积分的参数化语言来自 R2.1
      # （∫_(−R)^R f dx + ∫_(C_R) f dz 这个式子的每一项都是 R2.1 的围道积分）。
      - R2.1
    # 注：反例「deg 条件不满足时用半圆闭合」与 Jordan 引理「含 e^(iax) 时只需有界」
    # 互为条件打脸，但两者都在 R4.3 单元内部（对照表 + 两条 statement），不建跨节点边。
    tension: []
    dual: []
    # 组内收口；跨章下游（R6 支点留数变体、R8、de3.1 Laplace 反演、C1）
    # 由「被用于」栏（links 派生）承担。
    applies: []
