# graph/de1.yaml — 「de1 常微分方程」章（de1.1–de1.14）语义边真源。
# schema、方向约定与派生边覆盖规则见 A1.yaml 头部。
#
# 本文件的边来自**数据里的显式声明块**（各单元 statement 的「它依赖什么 / 谁依赖它」）：
# 组内边两侧互认（上游列本单元为下游 + 本单元列上游）；跨章边为单向声明，
# 但措辞清晰无噪声句式（无「对照混入依赖段」「分号第三方陈述」，见 HANDOFF §7.8 的三类噪声）。
# 覆盖后「同组编号序递进」派生边作废 —— 基线把同组所有编号在前的单元都算 prereq
# （如 de1.7 的基线是 [de1.1..de1.6]），声明收窄为直接依赖，丢掉的边经脚本逐条验证
# 为传递冗余或并行方法误判（de1.4 可降阶与 de1.5 特征方程是两条独立路径）。
# de1.15–de1.17（Bessel/Legendre/统一视角）被多个单元声明为下游但**尚未入库**，
# 入库后需回来补 applies。
notebook_commit: 9ca4702

nodes:
  de1.1: # 核心思想（两个动作：化为恰当 + 积分）
    # 起点：声明块自述依赖 P1（求和）、P6（分部积分），即 P1.1 / P6.1。
    prereq:
      # 「它依赖什么：P1（求和）、P6（分部积分）」——积分方程两边要逐项积分。
      - P1.1
      - P6.1
    tension: []
    dual: []
    applies: [] # 声明的下游（de1.2–de1.9）已由各单元的 prereq 承载

  de1.2: # 积分因子的系统求法
    prereq:
      # 「它依赖什么：de1.1 的两个动作」
      - de1.1
    tension: []
    dual: []
    applies: []

  de1.3: # 一阶线性方程的完整示例
    prereq:
      # 「它依赖什么：de1.2 的积分因子（特例 a）」
      - de1.2
    tension: []
    dual: []
    applies: []

  de1.4: # 可降阶的高阶方程
    prereq:
      # 「它依赖什么：de1.1 的「阶数与类型」、de1.3 的一阶方程解法（降阶后要解一阶）」
      - de1.1
      - de1.3
    tension: []
    dual: []
    applies: []

  de1.5: # 二阶线性常系数方程
    prereq:
      # 「它依赖什么：de1.1 的分类、de1.3 的一阶（降阶后用）」。
      # 注：基线里有 de1.4→de1.5（可降阶），但特征方程法与降阶是**并行路径**，
      # 声明未列（links 编号序噪声），丢。
      - de1.1
      - de1.3
    tension: []
    dual: []
    applies: []

  de1.6: # Euler 方程（等维方程）
    prereq:
      # 「它依赖什么：de1.5 的常系数解法（解法二的终点）」；
      # de1.4 侧声明「下游：de1.6（Euler 方程的「换自变量」）」—— 两侧互认。
      - de1.5
      - de1.4
    tension: []
    dual: []
    applies: []

  de1.7: # 待定系数法（常系数）
    prereq:
      # 「它依赖什么：de1.5 的 y_h（共振判定要用特征根）」。
      # 基线的 de1.4/de1.6 为同组递进噪声（待定系数不依赖它们）。
      - de1.5
    tension: []
    dual: []
    applies: []

  de1.8: # 常数变易法（通用）
    prereq:
      # 「它依赖什么：de1.5/de1.6 的齐次解、de1.7 的分工（四类用待定系数）」
      - de1.5
      - de1.6
      - de1.7
    tension: []
    dual: []
    applies: []

  de1.9: # 存在唯一性定理（Picard）
    prereq:
      # 「它依赖什么：de1.1 的方程分类、A2.1/A4.1 的压缩映射与不动点」。
      # 本单元的要点正是「从「闭式」转向「定性」」——与 de1.2–de1.8 的求解方法
      # 是**独立轨道**，基线的 8 条组内递进边全部为噪声，丢。
      # C5→de1.9（links 明写）同样不采：随机过程与 Picard 迭代是对照语义，声明未列。
      - de1.1
      - A2.1
      - A4.1
    tension: []
    dual: []
    applies: []

  de1.10: # 线性系统
    prereq:
      # 「它依赖什么：de1.5（标量情形）、de1.9（唯一性）、G3/G4.1（矩阵函数计算）」
      - de1.5
      - de1.9
      - G3
      - G4.1
    tension: []
    dual: []
    applies: []

  de1.11: # 稳定性理论
    prereq:
      # 「它依赖什么：de1.5（特征根）、de1.10（e^{At} 的长期行为）」。
      # 注：de1.11 声明的「下游：A2.1（Lyapunov）」**不采**——A2.1 同时是 de1.9 的
      # 上游（压缩映射），两个方向并存会造假环，且为单向声明。
      - de1.5
      - de1.10
    tension: []
    dual: []
    applies: []

  de1.12: # Sturm–Liouville 问题
    prereq:
      # 「它依赖什么：de1.5（二阶线性方程的框架）、A2.4（自伴算子与谱定理）」
      - de1.5
      - A2.4
    tension: []
    dual: []
    applies: []

  de1.13: # 常点展开
    prereq:
      # 「它依赖什么：de1.5 的常系数（本例恰为常系数可用特征方程）、
      #   de1.12（S-L 框架）、R3（幂级数与收敛半径）」。
      # 注：基线的 de1.9→de1.13（links 明写）不采：级数解的收敛性归 R3 管，
      # 存在唯一性不是级数展开的先修，声明未列。
      - de1.5
      - de1.12
      - R3
    tension: []
    dual: []
    applies: []

  de1.14: # Frobenius 方法（正则奇点）
    prereq:
      # 「它依赖什么：de1.13（常点展开，本条的起点）、de1.6（重根的 ln）」。
      # de1.6 从 de1.5→de1.6 可达但不在 de1.13 的祖先里，须显式写。
      - de1.13
      - de1.6
    tension: []
    dual: []
    applies:
      # Frobenius 方法的两大应用：Bessel（正则奇点 s=1/2 型）与 Legendre。
      - de1.15
      - de1.16

  de1.15: # Bessel 方程
    prereq:
      # 「它依赖什么：de1.12（S-L 框架）、de1.13/de1.14（Frobenius 展开正是
      # 求解手段；Bessel 方程 x=0 是正则奇点）」。
      # 跨章：P8.4（Stirling 公式）——J_ν 大宗量渐近的收尾工具，多条声明一致点名。
      # 注：links 里的 de2.10（未入库）与 H5（球谐函数是应用而非前修）不采。
      - de1.12
      - de1.13
      - de1.14
      - P8.4
    tension: []
    dual: []
    applies:
      # 球谐函数/球 Bessel 在 H5 中被使用。
      - H5

  de1.16: # Legendre 方程
    prereq:
      # 「它依赖什么：de1.12（S-L 框架）、de1.13/de1.14（Frobenius；
      # x=±1 正则奇点）」，de1.15 为并行特例但统一视角前需要两个样本
      # （声明里 de1.15 出现在 de1.16 的依赖列表）。
      - de1.12
      - de1.13
      - de1.14
      - de1.15
    tension: []
    dual: []
    applies:
      # 球谐函数 P_l^m 由 Legendre 方程生成（H5、F4 角动量多处引用）。
      - H5

  de1.17: # 特殊函数的统一视角
    prereq:
      # 统一视角=回头总结 Bessel/Legendre 两类正则奇点样本 + S-L 框架，
      # 声明一致列出 de1.12/de1.15/de1.16。
      - de1.12
      - de1.15
      - de1.16
    tension: []
    dual: []
    applies: []

  de1.18: # Green 函数方法（ODE 版本）
    prereq:
      # 「它依赖什么：de1.8（常数变易法——Green 函数是其「点源推广」，声明反复点名）、
      # de1.12（S-L 自伴框架，Green 函数的对称性来自自伴性）、de1.7（待定系数，
      # 分段拼解时的特解手段，两条声明列出）」。
      - de1.8
      - de1.12
      - de1.7
    tension: []
    dual: []
    applies: []
