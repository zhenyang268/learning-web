# graph/de2.yaml — 「de2 对称性与 PDE」章语义边真源（只覆盖派生边出错的单元）。
# schema、方向约定与派生覆盖规则见 A1.yaml 头部。
#
# 本组 2026-09-25 刚入库（de2.1–de2.6；de2.7+ / de3 / de4 仍在并行生成，入库后再回来补）。
# de2 分两条独立轨道：
#   · 对称性轨道 de2.1–de2.4（李群 → 对称性条件 → 标准解法 → 降阶步骤）——
#     派生边（组内编号递进 + de1 交叉）方向正确，**不覆盖**，交给派生；
#   · PDE 轨道 de2.5 起（分类 → 波动方程 → …）——与对称性轨道**无前置关系**，
#     但「同组编号递进」派生给 de2.5/de2.6 挂上了 de2.1–de2.4 全部四条假前置，必须覆盖。
notebook_commit: 62a761e

nodes:
  de2.5: # 二阶线性 PDE 的分类
    prereq:
      # 「PDE 轨道的起点」：判别式 B^2−4AC 分椭圆/抛物/双曲，与 de1.5 的特征方程
      # 是同一「常系数二阶」语言（de2.5 有一条声明提到 de1.5）。
      # de2.1–de2.4（对称性降阶轨道）与 PDE 分类是并行轨道，同组递进为噪声，剥。
      - de1.5
    tension: []
    dual: []
    applies:
      # 下游：波动方程（双曲型）直接用本单元的分类结论；R7「二维为什么特殊」
      # 也以本分类为框架（R7 侧 prereq 已声明，这里不重复写 R7）。
      - de2.6

  de2.6: # 波动方程（双曲型）
    prereq:
      # 双曲型是 de2.5 分类的三类之一；d'Alembert 公式的特征线方法与
      # de1.5 的特征方程同源（一条声明提到 de1.5，传依赖经 de2.5 承担，不重复）。
      - de2.5
    tension: []
    dual: []
    applies: []
