# graph/de3.yaml — 「de3 算子视角（Taylor/Laplace/无穷维矩阵）」章语义边真源。
# schema、方向约定与派生覆盖规则见 A1.yaml 头部。
#
# 本组 2026-09-25 入库至 de3.8（de3.9+ / de4 仍在并行生成，入库后再回来补）。
# 本章是把 de1/de2 的解法统一到「微分算子 = 无穷维矩阵」语言下的收编章，
# 跨章边密集且声明一致度高。组内编号递进大体符合真实顺序，但派生会把
# de3.1 起点挂上不存在的前置吗——不会；覆盖的动机是**显式声明关键跨章边**
# （de1.10/de1.12/de1.13/de2.13/de2.15 的收编关系），派生边无法表达。
notebook_commit: 62a761e

nodes:
  de3.1: # 两种「将微分方程化为代数」的方法
    prereq:
      # 总起单元：de2.12（7/8，Fourier 变换法）、de2.13（8/8，Laplace 变换法）——
      # 「两种方法」就是它们；de1.13（5/8，幂级数法作为第三条路的对照）。
      # de3.2/de3.3 是下游展开，不写。
      - de2.12
      - de2.13
      - de1.13
    tension: []
    dual: []
    applies: []

  de3.2: # Taylor 展开的算子视角
    prereq:
