      - de3.1
      - de1.13
    tension: []
    dual: []
    applies: []

  de3.3: # Laplace 变换的算子视角
    prereq:
      # de2.13（8/8，Laplace 变换本身）、de3.1（8/8，总起）、de3.2（5/8，
      # 两种算子法并列对照）。
      - de2.13
      - de3.1
      - de3.2
    tension: []
    dual: []
    applies: []

  de3.4: # 复平面上的联系
    prereq:
