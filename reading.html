<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朗读版笔记</title>
  <style>
    :root {
      --bg: #fbfaf7;
      --fg: #1c1c1e;
      --dim: #6b6b70;
      --line: #e2ded6;
      --accent: #7a4b2a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 17px/1.95 "Songti SC", "Source Han Serif SC", Georgia, serif;
      -webkit-font-smoothing: antialiased;
    }

    .wrap { display: flex; min-height: 100vh; }

    /* ---- 目录：固定左栏，可滚动 ---- */
    #toc {
      width: 268px;
      flex: 0 0 268px;
      height: 100vh;
      position: sticky;
      top: 0;
      overflow-y: auto;
      padding: 26px 18px 40px 22px;
      border-right: 1px solid var(--line);
      background: #f6f3ec;
      font-family: -apple-system, "PingFang SC", sans-serif;
      font-size: 13.5px;
      line-height: 1.7;
    }

    #toc h1 { font-size: 15px; margin: 0 0 4px; letter-spacing: .02em; }
    #toc .hint { color: var(--dim); font-size: 12px; margin: 0 0 18px; }
    #toc summary { cursor: pointer; font-weight: 600; padding: 3px 0; }
    #toc details details > summary { font-weight: 400; color: var(--dim); font-size: 12.5px; }
    #toc a {
      display: block;
      padding: 2px 0 2px 10px;
      color: #333;
      text-decoration: none;
      border-left: 2px solid transparent;
    }
    #toc a:hover { color: var(--accent); }
    #toc a.on { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }

    /* ---- 正文：单栏，宽度按可读行宽 ---- */
    #doc {
      flex: 1 1 auto;
      max-width: 44em;
      padding: 46px 40px 120px;
    }

    #doc h1 {
      font-size: 25px;
      line-height: 1.4;
      margin: 0 0 6px;
      letter-spacing: .01em;
    }

    #doc .src {
      color: var(--dim);
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      margin: 0 0 34px;
      word-break: break-all;
    }

    #doc h2 {
      font-size: 19px;
      margin: 44px 0 12px;
      padding-left: 11px;
      border-left: 3px solid var(--accent);
      line-height: 1.5;
    }

    #doc h3 { font-size: 16.5px; margin: 28px 0 8px; color: #3a3a3e; }

    #doc p { margin: 0 0 1.05em; text-align: justify; }

    #doc p.li { padding-left: 1.1em; text-indent: -1.1em; }

    #doc p.q {
      color: #4a4a50;
      border-left: 2px solid var(--line);
      padding-left: 12px;
    }

    /* 独立公式：朗读稿里已是口语文字，这里只做视觉区分 */
    #doc p.f {
      background: #f2eee4;
      border-radius: 4px;
      padding: 9px 13px;
      font-size: 16px;
    }

    #doc .empty { color: var(--dim); }

    #doc .bad {
      background: #fdecec;
      border-left: 3px solid #c94f4f;
      padding: 10px 14px;
      font-size: 14px;
    }

    @media (max-width: 880px) {
      .wrap { display: block; }
      #toc {
        width: auto;
        flex: none;
        height: auto;
        position: static;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      #doc { padding: 28px 22px 90px; max-width: none; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <aside id="toc">
      <h1>朗读版笔记</h1>
      <p class="hint">选中后右键「大声朗读」，或按 ⌥Esc</p>
      <nav id="nav"></nav>
    </aside>
    <main id="doc"><p class="empty">从左边选一篇。</p></main>
  </div>
  <script type="module" src="/src/reading/main.ts"></script>
</body>

</html>
